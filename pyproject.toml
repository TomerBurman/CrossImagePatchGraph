[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-image-glot"
version = "0.1.0"
description = "Cross-image patch graphs for few-shot visual adaptation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=9.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "torch-geometric>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
